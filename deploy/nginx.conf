server {
    listen 80;
    server_name _;
    location /health { proxy_pass http://app:8130/health; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/callqa.crt;
    ssl_certificate_key /etc/nginx/ssl/callqa.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 220m;      # приложение принимает файл до CALLQA_MAX_MB (200)
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    location / {
        proxy_pass http://app:8130;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # по нему приложение включает Secure-куку и HSTS
    }
}
