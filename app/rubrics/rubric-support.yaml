# Пример чек-листа «Поддержка». Это шаблон: пункты, веса и определения утверждает владелец методики.
code: support
version: 0.1
approved_by: null
approved_at: null
scale_note: "0 — не выполнено, 1 — частично, 2 — выполнено; null — неприменимо"

context: |
  Служба поддержки. Заявки ведутся в тикет-системе. Специалист 1-й линии
  должен зафиксировать заявку и передать сложный случай 2-й линии, а не обещать срок решения
  сам (уточнить регламент).

items:
  - code: greeting
    title: Приветствие и представление
    weight: 5
    definition: "Поздоровался, назвал имя и компанию/службу."
    levels: {2: "Полностью.", 1: "Частично.", 0: "Нет."}

  - code: identify
    title: Идентификация клиента
    weight: 10
    definition: "Уточнил организацию/контакт или номер заявки."
    levels: {2: "Уточнил.", 1: "Уточнил не полностью.", 0: "Не уточнил."}

  - code: diagnose
    title: Выяснение проблемы
    weight: 25
    definition: "Выяснил, что именно не работает, с какого момента, что уже пробовали, есть ли текст ошибки."
    levels:
      2: "Картина проблемы ясна из разговора."
      1: "Часть важных деталей не выяснена."
      0: "Проблему не выяснил."

  - code: solution
    title: Решение или корректная передача
    weight: 25
    definition: "Решил на линии или объяснил, кому и с какими данными передаёт."
    levels:
      2: "Решено или передано с понятным объяснением."
      1: "Передано без объяснения клиенту."
      0: "Не решено и не передано."

  - code: ticket
    title: Фиксация заявки
    weight: 10
    definition: "Сообщил о заявке в Zammad (номер или «зарегистрировал»)."
    levels: {2: "Да, с номером.", 1: "Упомянул без номера.", 0: "Нет."}

  - code: expectations
    title: Сроки и ожидания
    weight: 15
    definition: "Сказал, что будет дальше и когда клиент получит ответ, без обещаний вне регламента."
    levels: {2: "Понятно и в рамках регламента.", 1: "Размыто.", 0: "Не сказал или пообещал невозможное."}

  - code: politeness
    title: Тон и вежливость
    weight: 10
    critical: true
    definition: "Вежлив, терпелив, не обвиняет клиента."
    levels: {2: "Да.", 1: "Единичные резкости.", 0: "Грубость или обвинения."}
