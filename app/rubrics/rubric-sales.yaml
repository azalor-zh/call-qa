# Пример чек-листа «Продажи». Это шаблон: пункты, веса и определения утверждает владелец методики.
code: sales
version: 0.1
approved_by: null
approved_at: null
scale_note: "0 — не выполнено, 1 — частично, 2 — выполнено; null — неприменимо"

context: |
  Компания. Менеджер вправе: называть цены из прайса, скидку до N % (уточнить),
  сроки доставки по городу 1–2 дня (уточнить). Не вправе: обещать бесплатную доставку
  вне акций, давать скидку выше лимита без согласования.

items:
  - code: greeting
    title: Приветствие и представление
    weight: 5
    definition: "Поздоровался, назвал своё имя и компанию в первые 15 секунд."
    levels:
      2: "Приветствие + имя + компания."
      1: "Есть приветствие, но нет имени или компании."
      0: "Нет приветствия или начал сразу с вопроса."

  - code: needs
    title: Выявление потребности
    weight: 20
    definition: "Задал открытые/уточняющие вопросы о задаче клиента до предложения товара."
    levels:
      2: "Не менее двух уточняющих вопросов (назначение, объём, сроки, бюджет)."
      1: "Один вопрос или вопросы только закрытые."
      0: "Сразу предложил товар без вопросов."

  - code: offer
    title: Предложение по потребности
    weight: 20
    definition: "Предложение связано с ответами клиента, названы выгоды, а не только характеристики."
    levels:
      2: "Предложение опирается на сказанное клиентом и объясняет, почему подходит."
      1: "Предложение есть, связь с потребностью слабая."
      0: "Предложения нет или оно не связано с запросом."

  - code: objections
    title: Работа с возражениями
    weight: 15
    applicable_when: "Клиент высказал сомнение, возражение или сравнение с конкурентом."
    definition: "Выслушал, уточнил суть, ответил по существу, не спорил."
    levels:
      2: "Уточнил и ответил по существу."
      1: "Ответил шаблонно или частично."
      0: "Проигнорировал, спорил или сразу сдался."

  - code: next_step
    title: Следующий шаг
    weight: 20
    definition: "Договорился о конкретном следующем действии: счёт, КП, встреча, повторный звонок с датой."
    levels:
      2: "Конкретное действие и срок."
      1: "Действие без срока («я вам перезвоню»)."
      0: "Разговор закончился без договорённости."

  - code: accuracy
    title: Корректность информации
    weight: 10
    definition: "Цены, сроки и условия названы верно и в пределах полномочий (см. context)."
    levels:
      2: "Ошибок и превышения полномочий нет."
      1: "Неточность без последствий."
      0: "Неверная информация или обещание вне полномочий."

  - code: politeness
    title: Тон и вежливость
    weight: 10
    critical: true          # 0 по этому пункту — флаг руководителю, итог помечается
    definition: "Вежлив, не перебивает, не повышает голос, без пренебрежения."
    levels:
      2: "Вежлив на протяжении всего звонка."
      1: "Единичные перебивания или резкие формулировки."
      0: "Грубость, раздражение, пренебрежение."
