# Каталог локальных моделей оценки для встроенного Ollama (админка → Модели → «Модель на нашем сервере»).
# Файл редактируется без пересборки кода (перезапустить app). Теги — из https://ollama.com/library.
# ВАЖНО: теги и размеры внесены по справочным данным, не проверены замером на наших записях. Перед продажей
# прогнать каждую модель по эталонным звонкам (docs/05) и убрать неподходящие.
# size_gb — размер загрузки, vram_gb — ориентир видеопамяти (Q4, контекст 8–16K); на процессоре работает, но медленно.
models:
  - tag: qwen3:8b
    title: Qwen3 8B
    size_gb: 5.2
    vram_gb: 8
    note: Минимум для пробы. Русский хороший, казахский слабее. Оценки менее ровные.
  - tag: qwen3:14b
    title: Qwen3 14B
    size_gb: 9.3
    vram_gb: 12
    note: Баланс для карты 12–16 ГБ. Русский хороший, JSON по схеме держит устойчиво.
  - tag: gemma3:12b
    title: Gemma 3 12B
    size_gb: 8.1
    vram_gb: 12
    note: Альтернатива Qwen3 14B, другая семья. Сравнить на ваших звонках.
  - tag: qwen3:30b-a3b
    title: Qwen3 30B-A3B (MoE)
    size_gb: 19
    vram_gb: 24
    note: Быстрая (3B активных параметров), как 35B-A3B на пилоте. Нужна карта 24 ГБ.
  - tag: qwen3:32b
    title: Qwen3 32B
    size_gb: 20
    vram_gb: 24
    note: Максимум качества из списка, ближе всего к 27B пилота. Медленнее MoE.
